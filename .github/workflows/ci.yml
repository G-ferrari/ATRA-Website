name: CI

on:
  pull_request:
  push:
    # `migracao` está aqui para o CI rodar durante a migração inteira: sem isso
    # ele só dispararia em PR ou em push para main, e a branch de trabalho
    # ficaria sem validação nenhuma até a virada.
    branches: [main, migracao]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: lint · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    services:
      # O build do Payload conecta no banco para conferir o schema.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atra
          POSTGRES_PASSWORD: atra
          POSTGRES_DB: atra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atra -d atra"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URI: postgres://atra:atra@localhost:5432/atra
      PAYLOAD_SECRET: ci-secret-not-used-in-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: atra-media
      S3_ACCESS_KEY: ci
      S3_SECRET_KEY: ci-secret
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4

      # O projeto vive em `web/`; não há package.json na raiz, e a action lê
      # `packageManager` de lá por padrão. Sem apontar o caminho, ela falha
      # antes de qualquer passo útil — foi como o CI reprovou na primeira
      # execução de verdade.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # --frozen-lockfile falha se o lock estiver fora de sync. É exatamente o
      # problema que quebrou o `npm ci` no projeto legado.
      - run: pnpm install --frozen-lockfile

      # Nenhum segredo pode ter prefixo NEXT_PUBLIC_ — o prefixo injeta a
      # variável no bundle do cliente. Ver docs/04-infra/ambientes.md.
      - name: Segredo exposto ao cliente?
        run: |
          if grep -rnE 'NEXT_PUBLIC_[A-Z_]*(KEY|SECRET|TOKEN|PASSWORD)' src .env.example; then
            echo "::error::Segredo com prefixo NEXT_PUBLIC_ — iria para o bundle do cliente."
            exit 1
          fi
          echo "OK: nenhum segredo com prefixo público."

      - run: pnpm lint

      # Falha se payload-types.ts estiver defasado do schema.
      - name: Tipos do Payload em dia?
        run: |
          pnpm generate:types
          if ! git diff --quiet -- src/payload-types.ts; then
            echo "::error::payload-types.ts desatualizado. Rode 'pnpm generate:types' e commite."
            git diff --stat -- src/payload-types.ts
            exit 1
          fi
          echo "OK: tipos em dia."

      # O importMap precisa conter todo componente de campo em uso. Ficar
      # defasado não quebra o build: quebra silenciosamente o campo no admin.
      - name: importMap em dia?
        run: |
          pnpm generate:importmap
          if ! git diff --quiet -- 'src/app/(payload)/admin/importMap.js'; then
            echo "::error::importMap desatualizado. Rode 'pnpm generate:importmap' e commite."
            exit 1
          fi
          echo "OK: importMap em dia."

      # `PageProps` e `LayoutProps` são tipos que o Next gera em `.next/types`
      # a partir da árvore de rotas. Num checkout limpo eles não existem e o
      # tsc falha em rotas corretas — foi o segundo motivo de reprovação na
      # estreia do CI. Localmente o dev server já os gerou, por isso passava.
      - run: pnpm typegen
      - run: pnpm typecheck

      # O Postgres do CI sobe vazio. `generateStaticParams` consulta `cases`
      # durante o build, então o schema precisa existir antes — as migrações
      # versionadas (D-21) são a única fonte dele, já que `push` está
      # desligado. Terceiro motivo de reprovação na estreia do CI.
      # `pnpm migrate` e não `pnpm payload migrate`: o invólucro recusa a saída
      # calada do CLI — ver `web/scripts/migrar.mjs` (28/09).
      - run: pnpm migrate

      # Unitário cobre onde há lógica: mappers, conversor do WP, redirects,
      # rate limit. Componente de marketing fica com a regressão visual.
      - run: pnpm test

      - run: pnpm build

  e2e:
    name: smoke · comportamento
    # Religado em 27/09/2026 (D-39), **sem** a comparação com o protótipo. Ficou
    # desligado desde 26/08 (decisão do Leonardo, para iterar em homologação), e
    # nesse meio-tempo o site mudou de propósito (D-31, passada de 13/09): o
    # gabarito de 21/08 reprovaria todas as rotas por decisão de design, não por
    # regressão (P-30). O que roda aqui é a suíte padrão do `pnpm gate` — smoke,
    # comportamento das ilhas, contraste nos dois temas, redirects e axe —, e a
    # paridade fica só para quem a liga à mão (`PARIDADE_COM_PROTOTIPO=1`).
    runs-on: ubuntu-latest
    needs: verify

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atra
          POSTGRES_PASSWORD: atra
          POSTGRES_DB: atra
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U atra -d atra"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URI: postgres://atra:atra@localhost:5432/atra
      PAYLOAD_SECRET: ci-secret-not-used-in-production
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: atra-media
      S3_ACCESS_KEY: atra
      S3_SECRET_KEY: atra12345
      NEXT_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - uses: actions/checkout@v4
      # O projeto vive em `web/`; não há package.json na raiz, e a action lê
      # `packageManager` de lá por padrão. Sem apontar o caminho, ela falha
      # antes de qualquer passo útil — foi como o CI reprovou na primeira
      # execução de verdade.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # ⚠️ O app legado **não sobe mais** aqui (D-39): a suíte padrão não visita
      # o :3001, e o `gate.mjs` só o exige nos modos de paridade. A *pasta*
      # `legacy/` continua sendo lida — o seed tira dela as fotos do protótipo
      # que `SEED_FIXTURES` põe no lugar dos marcadores (D-27) —, mas isso é
      # arquivo do checkout, não servidor.

      # O seed sobe imagem para o storage; sem isto o job morria em
      # `ECONNREFUSED :9000` no primeiro upload, porque `S3_ENDPOINT` apontava
      # para um serviço que não existia aqui. Foi o segundo motivo de MIG-010
      # nunca ter tido execução verde.
      #
      # Sobe pelo compose do projeto, e não como `services:` do workflow: a
      # imagem oficial precisa do comando `server /data`, e serviço do Actions
      # não deixa sobrescrever o comando. Assim a definição vive num lugar só e
      # o `createbucket` vem junto.
      # ⚠️ O `createbucket` fica fora do `--wait`: ele cria o bucket e **sai**,
      # e o `--wait` trata contêiner encerrado como falha, mesmo com código 0.
      - name: Sobe o storage (:9000)
        run: |
          docker compose up -d --wait minio
          docker compose up createbucket

      - run: pnpm install --frozen-lockfile
        working-directory: web
      # Mesmo motivo do job `verify`: o build lê o banco em
      # `generateStaticParams`, e o Postgres do CI sobe vazio.
      # `pnpm migrate` e não `pnpm payload migrate`: o invólucro recusa a saída
      # calada do CLI — ver `web/scripts/migrar.mjs` (28/09).
      - run: pnpm migrate
        working-directory: web

      # Sem seed o app sobe vazio, e a suíte confere conteúdo: os 8 perfis de
      # `/consultores`, as soluções do índice, o rascunho que não pode vazar, o
      # material e o webinar com slug fixo.
      # `SEED_FIXTURES` liga os 6 posts e as 6 vagas fictícias do protótipo, que
      # a suíte precisa para exercitar /blog e /carreiras sem ir à rede. Num
      # banco de verdade eles não entram: o conteúdo real vem de
      # `scripts/wp-import` (Fase 4b) e conteúdo inventado no ar seria pior do
      # que uma listagem vazia.
      - run: pnpm seed
        env:
          SEED_FIXTURES: '1'
        working-directory: web

      # `pnpm gate` faz tudo: build de produção, sobe em :3100 e roda a suíte
      # dentro da imagem oficial do Playwright — a mesma do macOS, para uma
      # falha aqui se reproduzir lá (MIG-035). Sem `PARIDADE_COM_PROTOTIPO` no
      # ambiente, é o modo padrão: nada compara com o protótipo (D-39).
      - run: pnpm gate
        working-directory: web

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

      # Capturas e traces de cada falha: é o que permite julgar uma reprovação
      # sem reproduzir localmente.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: artefatos-de-falha
          path: web/e2e/.artifacts
          retention-days: 7

  deploy:
    name: deploy na VPS
    # Só em push para `main`. PR não faz deploy: o código de fora do
    # repositório nunca deve chegar ao servidor.
    # Até 01/10 era a `migracao` que publicava (D-44): a publicação não pode
    # depender de quem trabalha nela. Publicar é merge da `migracao` na
    # `main` — e só nesse sentido: push de uma `main` atrasada leva ao ar
    # código velho sobre um banco já migrado.
    # O e2e voltou ao `needs` em 27/09 (D-39): de 26/08 até ali o deploy saía
    # só com o `verify`. Religar era pré-requisito do cutover — um deploy que
    # não espera a suíte leva ao ar o formulário que parou de gravar.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [verify, e2e]
    runs-on: ubuntu-latest
    # Um deploy de cada vez, sem cancelar o que está no meio: interromper entre
    # a migração e a troca de imagem deixa o banco à frente do site.
    concurrency:
      group: deploy-vps
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          # ⚠️ Keepalive obrigatório: o build na VPS fica minutos sem tráfego e o
          # caminho Azure→Hostinger derruba conexão ociosa (~4min) — o deploy
          # morria em "Broken pipe" no meio do build.
          cat >> ~/.ssh/config <<'CFG'
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 8
          CFG
          # ⚠️ Chave do host FIXADA, não escaneada. O keyscan por run já falhou
          # duas vezes — o caminho até a Hostinger engole handshakes de vez em
          # quando, e numa delas engoliu as três tentativas. Fixar remove a
          # dependência de rede e fecha o que o scan deixava aberto: aceitar a
          # chave de quem quer que responda é confiar no primeiro a atender.
          echo "${{ secrets.VPS_HOST_KEY }}" > ~/.ssh/known_hosts

      - name: Código para a VPS
        # `VPS_USER` vazio cai em root, que é como a Hostinger funciona. A VM do
        # Google (30/09) não aceita root por SSH: lá o usuário é outro, no grupo
        # docker, dono de /opt/atra (infra/provisionar/preparar-vm.sh).
        # O mesmo conjunto que o Dockerfile consome (contexto = raiz do repo,
        # por causa do redirects.csv — ver o topo do Dockerfile). `legacy/` fica
        # de fora: o runtime não lê nada de lá, só o seed, que não roda aqui.
        #
        # ⚠️ Com retry: o mesmo filtro intermitente que comia o keyscan pode
        # comer a primeira conexão do rsync. Três tentativas, 20s entre elas.
        run: |
          tentar() { for i in 1 2 3; do "$@" && return 0; sleep 20; done; return 1; }
          tentar rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .git \
            --exclude legacy --exclude test-results --exclude playwright-report \
            --exclude '.env*' \
            -e "ssh -i ~/.ssh/deploy" \
            Dockerfile docker-compose.prod.yml Caddyfile web docs infra \
            ${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST }}:/opt/atra/

      - name: Migra, builda e troca
        # Retry aqui também — e é seguro: o deploy.sh é a própria rotina de
        # recuperação (build refeito, migração idempotente, troca com
        # healthcheck e rollback). Cair no meio e recomeçar é o caminho normal.
        run: |
          tentar() { for i in 1 2 3; do "$@" && return 0; sleep 20; done; return 1; }
          tentar ssh -i ~/.ssh/deploy ${{ secrets.VPS_USER || 'root' }}@${{ secrets.VPS_HOST }} \
            "chmod +x /opt/atra/infra/deploy/deploy.sh /opt/atra/infra/backup/*.sh && /opt/atra/infra/deploy/deploy.sh ${{ github.sha }}"
