# Banco e storage **descartáveis** do `pnpm check` (D-59) — o que o job de ponta
# a ponta do CI subia a cada rodada, agora na máquina de quem publica.
#
# Quem usa é `web/scripts/check.mjs`, com `-p atra-check`: sobe, migra do zero,
# semeia com as fixtures, roda o gate e derruba com `down -v`.
#
# ⚠️ Portas próprias (55432, 59000), e não as do `docker-compose.yml`: o
# ambiente de desenvolvimento fica de pé enquanto a esteira roda, e o banco dele
# não recebe fixture nenhuma — `SEED_FIXTURES=1` no banco de dev era o que
# sujava a revisão com doze itens inventados.
#
# ⚠️ Sem volume nomeado: cada corrida começa de um Postgres vazio. É a única vez
# que as migrações rodam num banco zerado antes do deploy, e banco reaproveitado
# é verde falso (ver "Recusado" na D-58).

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: atra
      POSTGRES_PASSWORD: atra
      POSTGRES_DB: atra
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atra -d atra"]
      interval: 2s
      timeout: 5s
      retries: 30

  # A mesma imagem do compose de desenvolvimento, presa pelo mesmo digest — ver
  # lá por que não é `minio/minio`.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data
    environment:
      MINIO_ROOT_USER: atra
      MINIO_ROOT_PASSWORD: atra12345
    ports:
      - "59000:9000"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 30

  # ⚠️ Fora do `--wait`: cria os buckets e **sai**, e o `--wait` trata contêiner
  # encerrado como falha, mesmo com código 0.
  createbucket:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 atra atra12345 &&
      mc mb --ignore-existing local/atra-media &&
      mc mb --ignore-existing local/atra-privado &&
      mc anonymous set download local/atra-media
      "
    restart: "no"
