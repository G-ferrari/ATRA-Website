# Dependências de desenvolvimento. O Next roda nativo (`cd web && pnpm dev`) —
# ver docs/04-infra/docker.md para o porquê dessa divisão.
#
# O app legado tem o compose dele em legacy/, na porta 3001.

services:
  # App novo (Next + Payload). Roda em container para o ambiente subir inteiro
  # com um comando e ficar disponível para validação sem depender de sessão.
  #
  # docs/04-infra/docker.md explica por que o modo nativo (`cd web && pnpm dev`)
  # continua sendo o caminho recomendado para desenvolver: no macOS o HMR em
  # bind mount é mais lento. Os dois caminhos coexistem — escolha o seu.
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    # Teto de CPU, medido: sem ele o contêiner não tem cota nenhuma
    # (`cpu.max = max`) e o Docker Desktop, no padrão, entrega à VM os 10 núcleos
    # da máquina. Uma compilação a frio de **uma** rota chegou a 514% de CPU, e a
    # primeira requisição a `/` levou 86s — 68s só de Turbopack — com o Mac
    # inteiro parado nesse intervalo.
    #
    # ⚠️ Isto **não** deixa a compilação mais rápida; deixa a máquina utilizável
    # enquanto ela acontece. Os 4 núcleos que sobram são para o macOS.
    #
    # O contêiner continua vendo `nproc = 10`, então o Turbopack segue criando 10
    # workers — eles apenas dividem a cota de 6. Não adianta procurar variável
    # para reduzir o número de workers: nem o libuv nem o Turbopack leem o cgroup.
    cpus: 6
    ports:
      - "3000:3000"
    environment:
      # Dentro da rede do compose os serviços se acham pelo nome, não por localhost.
      DATABASE_URI: postgres://atra:atra@postgres:5432/atra
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: atra-media
      S3_PRIVATE_BUCKET: atra-privado
      S3_ACCESS_KEY: atra
      S3_SECRET_KEY: atra12345
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev-secret-trocar-em-producao}
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      # Integração com o ATRAIR (D-33): a grade de /carreiras lista as vagas
      # que o ATRAIR publica, e cada card leva para a página da vaga lá.
      #
      # ⚠️ Estas duas NÃO são mais o interruptor (D-41): quem liga e desliga é
      # o global `integrations` no admin (Sistema → Integrações). A URL aqui é
      # a **reserva** com que o campo do admin nasce preenchido — o admin
      # vence. A chave segue sendo credencial, e é a segunda tranca.
      #
      # ⚠️ `host.docker.internal`, não `localhost`: dentro do contêiner,
      # localhost é o PRÓPRIO contêiner. O ATRAIR roda fora deste compose —
      # nativo ou no compose dele — então o endereço é o da máquina.
      #
      # Sem estas duas, nada quebra: a grade cai para a lista do CMS, que é o
      # comportamento projetado para quando o ATRAIR está fora — e é o mesmo
      # que a chave desligada no admin produz.
      ATRAIR_API_URL: ${ATRAIR_API_URL:-http://host.docker.internal:3300}
      ATRAIR_API_KEY: ${ATRAIR_API_KEY:-}
    volumes:
      - ./web:/app
      # ⚠️ `docs/` entra porque o `next.config.ts` lê
      # `docs/02-especificacao/dados/redirects.csv` em tempo de build (MIG-108).
      # O arquivo mora fora de `web/` de propósito — é especificação, e quem
      # revisa a curadoria dos 258 redirects não abre o repositório do app.
      #
      # Sem esta linha o contêiner sobe, o Next carrega a config, o `readFile`
      # estoura ENOENT e o processo morre — em `restart: unless-stopped` isso é
      # um laço de reinício. Somente leitura: o app não escreve em spec.
      - ./docs:/docs:ro
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: atra
      POSTGRES_PASSWORD: atra
      POSTGRES_DB: atra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atra -d atra"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Storage S3-compatível. Mesma API do S3/R2, sem credencial de nuvem na
  # máquina de ninguém e funcionando offline.
  #
  # ⚠️ Não voltar para `minio/minio`. Em set/2026 o MinIO tirou as imagens
  # públicas do Docker Hub e do quay.io, e o CI morreu em "pull access denied"
  # antes de rodar um teste. `pgsty/minio` é o fork comunitário do mesmo código:
  # mesmo entrypoint, mesmo `server /data`, e já traz o `mc` — por isso o
  # `createbucket` usa a mesma imagem. Presa por digest porque é de terceiro.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: atra
      MINIO_ROOT_PASSWORD: atra12345
    ports:
      - "9000:9000"   # API
      - "9001:9001"   # console web
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria o bucket na primeira subida e sai. Sem isso, o primeiro upload falha.
  createbucket:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 atra atra12345 &&
      mc mb --ignore-existing local/atra-media &&
      mc mb --ignore-existing local/atra-privado &&
      mc anonymous set download local/atra-media &&
      echo 'bucket atra-media pronto'
      "
    restart: "no"

volumes:
  pgdata:
  minio:
  web_node_modules:
  web_next:
